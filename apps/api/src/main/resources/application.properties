spring.application.name=spring-api

# SQLite Database Configuration (Development)
spring.datasource.url=jdbc:sqlite:./data/gamedb.sqlite
spring.datasource.driverClassName=org.sqlite.JDBC

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thumbnail cache configuration
thumbnail.cache.directory=./data/thumbnails
thumbnail.cache.enabled=true

# IGDB API Configuration (Twitch OAuth)
# Get credentials from https://dev.twitch.tv/console/apps
igdb.client-id=${IGDB_CLIENT_ID:}
igdb.client-secret=${IGDB_CLIENT_SECRET:}
igdb.enabled=true

# Steam API Configuration
# Get API key from https://steamcommunity.com/dev/apikey
steam.api-key=${STEAM_API_KEY:}
steam.api-url=https://api.steampowered.com
steam.enabled=true

# CORS allowed origins (comma-separated). Defaults to the local Angular dev server.
# Set CORS_ALLOWED_ORIGINS=* to allow any origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Default gamer used when a request does not specify a userId
app.default-gamer-id=${APP_DEFAULT_GAMER_ID:4c580456-1116-4091-b1d6-99fc02b47246}

# Reference games used by GET /scraper/health to smoke-test the scraping pipeline
# (catalog search + enrichment providers + thumbnail download). Comma-separated.
scraper.reference-games=Elden Ring,Hades,Stardew Valley,Cyberpunk 2077

# Actuator: expose only the health endpoint (used by the monthly health-check workflow)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
