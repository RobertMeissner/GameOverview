name: Pull Request Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    name: Frontend Tests (Angular)
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend dependencies
        run: npm install

      - name: Run Frontend tests with coverage
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=json-summary --coverage.reporter=text

      - name: Build Frontend (production build test)
        run: npm run build

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{ts,html,scss}"
        continue-on-error: true

      - name: Upload Frontend test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: apps/frontend/coverage/
          retention-days: 7

      - name: Frontend Test Summary
        if: always()
        run: |
          echo "## Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo " No coverage report generated" >> $GITHUB_STEP_SUMMARY
          fi

  api-tests:
    runs-on: ubuntu-latest
    name: API Tests (Spring Boot)
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting (Spotless) and build/test API
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check verify

  quality-summary:
    runs-on: ubuntu-latest
    name: Quality Metrics Summary
    needs: [frontend-tests, api-tests]
    if: always()

    steps:
      - name: Download Frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend
        continue-on-error: true

      - name: Generate Quality Summary
        run: |
          echo "## 📊 Quality Metrics Overview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.api-tests.result }}" == "success" ]; then
            echo "| API (Spring Boot) | \u2705 Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| API (Spring Boot) | \u274c Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.frontend-tests.result }}" == "success" ]; then
            echo "| Frontend (Angular) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend (Angular) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports are available as artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- **frontend-coverage**: LCOV and JSON coverage for Frontend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo " **Note**: API tests run on Java 25 in the \`api-tests\` job; locally use \`./mvnw test\` in the \`apps/api\` directory." >> $GITHUB_STEP_SUMMARY
