name: Monthly Scraper Health Check

# Runs the API locally and smoke-tests the external scraping pipeline
# (IGDB/Steam/HLTB/GOG/Rawg + thumbnail download) against the reference games
# configured in `scraper.reference-games` via GET /scraper/health.
# On failure it opens a GitHub issue so broken external APIs get noticed.

on:
  schedule:
    # Monthly on the 1st at 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: Scraper Health Check
    defaults:
      run:
        working-directory: apps/api

    env:
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build API (skip tests)
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Start API in background
        run: |
          java -jar target/api-0.0.1-SNAPSHOT.jar > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for actuator health endpoint
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true)
            if [ "$status" = "200" ]; then
              echo "API is up after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy; last log lines:"
          tail -50 /tmp/api.log
          exit 1

      - name: Run scraper health check
        run: |
          curl -fsS http://localhost:8080/scraper/health -o /tmp/health.json
          cat /tmp/health.json | jq .
          echo "FAILED_COUNT=$(jq -r '.failedCount' /tmp/health.json)" >> "$GITHUB_ENV"
          echo "OK_COUNT=$(jq -r '.okCount' /tmp/health.json)" >> "$GITHUB_ENV"

      - name: Stop API
        if: always()
        run: kill "$API_PID" 2>/dev/null || true

      - name: Report failure as issue
        if: failure() && env.FAILED_COUNT != '0'
        run: |
          TITLE="[health-check] Scraper health check failing (${FAILED_COUNT} reference games failed)"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE" --json number --jq '.[].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "Open issue already exists: #$EXISTING"
            exit 0
          fi
          {
            echo "## Scraper health check failed on $(date -u +%Y-%m-%d)"
            echo ""
            echo "Reference games checked: $OK_COUNT ok / $FAILED_COUNT failed"
            echo ""
            echo '```json'
            cat /tmp/health.json | jq .
            echo '```'
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/issue-body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue-body.md
